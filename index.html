<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fourth Year Timetable</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#05070D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timetable">
<script>
  try {
    var t = localStorage.getItem("fy-theme-v1");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<style>
  :root {
    --bg: #EEF1F7;
    --glass: rgba(255,255,255,0.55);
    --glass-strong: rgba(255,255,255,0.75);
    --glass-border: rgba(255,255,255,0.7);
    --ink: #10131F;
    --muted: #666E80;
    --line: rgba(16,19,31,0.08);
    --danger: #E5384D;
    --shadow: 0 10px 30px -12px rgba(20,24,50,0.25);
    --c0: #0A84FF; --c1: #8A5CF6; --c2: #22C58B; --c3: #FF3B5C; --c4: #E8A400; --c5: #FF8A34; --c6: #2FB5D2;
    --glow-op: 0.25;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #05060B;
      --glass: rgba(36,40,58,0.5);
      --glass-strong: rgba(46,50,72,0.68);
      --glass-border: rgba(255,255,255,0.14);
      --ink: #F3F5FC;
      --muted: #9AA2BE;
      --line: rgba(255,255,255,0.09);
      --shadow: 0 14px 34px -14px rgba(0,0,0,0.6);
      --c0: #4DA3FF; --c1: #A98BFF; --c2: #3EE3A6; --c3: #FF6B85; --c4: #FFC64D; --c5: #FFA35C; --c6: #4FD3EE;
      --glow-op: 0.55;
    }
  }
  :root[data-theme="dark"] {
    --bg: #05060B;
    --glass: rgba(36,40,58,0.5);
    --glass-strong: rgba(46,50,72,0.68);
    --glass-border: rgba(255,255,255,0.14);
    --ink: #F3F5FC;
    --muted: #9AA2BE;
    --line: rgba(255,255,255,0.09);
    --shadow: 0 14px 34px -14px rgba(0,0,0,0.6);
    --c0: #4DA3FF; --c1: #A98BFF; --c2: #3EE3A6; --c3: #FF6B85; --c4: #FFC64D; --c5: #FFA35C; --c6: #4FD3EE;
    --glow-op: 0.55;
  }
  :root[data-theme="light"] { --glow-op: 0.25; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; min-height: 100%; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    line-height: 1.35; -webkit-font-smoothing: antialiased;
    background: var(--bg);
    position: relative;
    overflow-x: hidden;
  }
  /* glow field behind everything */
  body::before, body::after {
    content: ""; position: fixed; z-index: 0; pointer-events: none; border-radius: 50%;
    filter: blur(70px); opacity: var(--glow-op);
  }
  body::before {
    width: 60vw; height: 60vw; max-width: 480px; max-height: 480px;
    top: -12%; right: -18%;
    background: radial-gradient(circle, var(--c0), transparent 70%);
  }
  body::after {
    width: 55vw; height: 55vw; max-width: 440px; max-height: 440px;
    bottom: -14%; left: -16%;
    background: radial-gradient(circle, var(--c1), transparent 70%);
  }

  .page { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 20px 14px 84px; }
  .page.wide { max-width: 820px; }

  /* ---- glass utility ---- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.25);
  }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 2px 0; }
  header h1 {
    margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1;
    background: linear-gradient(120deg, var(--ink), color-mix(in srgb, var(--ink) 60%, var(--c0)));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; font-weight: 500; }

  .iconbtn {
    flex: none; width: 38px; height: 38px; border-radius: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--ink);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .iconbtn:active { transform: scale(0.92); }
  .iconbtn[aria-pressed="true"] {
    background: linear-gradient(150deg, var(--c0), var(--c1));
    color: #fff; border-color: transparent;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset, 0 0 18px -2px color-mix(in srgb, var(--c0) 70%, transparent);
  }

  .themeseg { display: inline-flex; gap: 1px; padding: 3px; border-radius: 13px; flex: none; }
  .themeseg button {
    width: 27px; height: 27px; border-radius: 10px; border: 0; background: transparent;
    color: var(--muted); font-size: 12.5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
  }
  .themeseg button:active { transform: scale(0.9); }
  .themeseg button[aria-selected="true"] {
    background: linear-gradient(150deg, var(--c0), var(--c1)); color: #fff;
    box-shadow: 0 0 10px -2px color-mix(in srgb, var(--c0) 70%, transparent), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .seg {
    display: inline-flex; gap: 2px; margin: 16px 0 14px; padding: 3px; border-radius: 14px;
  }
  .seg button {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--muted);
    border: 0; background: transparent; padding: 7px 18px; border-radius: 11px; cursor: pointer;
    transition: color 0.2s ease;
  }
  .seg button[aria-selected="true"] {
    background: var(--glass-strong); color: var(--ink);
    box-shadow: 0 3px 10px -4px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.35);
  }

  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--c0); outline-offset: 2px; }

  .days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 16px; }
  .days button {
    position: relative; font: inherit; font-size: 12.5px; font-weight: 700;
    padding: 9px 0; border-radius: 12px; cursor: pointer; color: var(--muted);
    transition: transform 0.15s ease;
  }
  .days button:active { transform: scale(0.94); }
  .days button[aria-selected="true"] {
    background: linear-gradient(155deg, var(--c0), var(--c1)); color: #fff; border-color: transparent;
    box-shadow: 0 0 16px -3px color-mix(in srgb, var(--c0) 65%, transparent), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .days button.today:not([aria-selected="true"])::after {
    content: ""; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px;
    margin-left: -2px; border-radius: 50%; background: var(--c2);
    box-shadow: 0 0 6px 1px color-mix(in srgb, var(--c2) 70%, transparent);
  }

  .dayhead { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 4px 10px; }
  .dayhead h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .dayhead span { color: var(--muted); font-size: 12px; font-weight: 600; }

  .tl { display: grid; grid-template-columns: 42px 1fr; grid-auto-rows: 54px; }
  .tl .time { grid-column: 1; font-size: 11px; font-weight: 700; color: var(--muted); padding-top: 4px; }
  .tl .slot { grid-column: 2; border-top: 1px solid var(--line); }

  .block {
    --c: var(--ink);
    position: relative; margin: 2px 0; padding: 8px 12px; border-radius: 14px; overflow: hidden;
    background: linear-gradient(155deg, color-mix(in srgb, var(--c) 22%, var(--glass)), color-mix(in srgb, var(--c) 10%, var(--glass)));
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid color-mix(in srgb, var(--c) 35%, var(--glass-border));
    box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--c) 55%, transparent), inset 0 1px 0 rgba(255,255,255,0.25);
    text-align: left; width: 100%; font: inherit; cursor: default;
    transition: transform 0.15s ease;
  }
  .tl .block { grid-column: 2; }
  .block b { display: block; font-size: 13.5px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
  .block .who { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; font-weight: 600; }
  .block .when { display: block; font-size: 10.5px; font-weight: 800; margin-top: 5px; color: var(--c); letter-spacing: 0.01em; }
  .block.editable { cursor: pointer; }
  .block.editable:active { transform: scale(0.98); }

  .empty {
    padding: 34px 18px; text-align: center; border-radius: 18px;
  }
  .empty b { display: block; font-size: 15px; margin-bottom: 3px; font-weight: 800; }
  .empty span { color: var(--muted); font-size: 12.5px; }

  .addslot {
    margin: 2px 0; border-radius: 14px; border: 1.5px dashed var(--line); background: transparent;
    color: var(--muted); font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; width: 100%;
    display: flex; align-items: center; justify-content: center; opacity: 0;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .editing .addslot { opacity: 0.8; }
  .addslot:hover, .addslot:active { background: var(--glass); opacity: 1; }

  .scroll { overflow-x: auto; padding-bottom: 4px; border-radius: 16px; }
  .wk { display: grid; min-width: 600px; grid-template-columns: 38px repeat(6, minmax(84px, 1fr)); padding: 4px; }
  .wk .dh { font-size: 12px; font-weight: 800; padding: 6px 4px 0; }
  .wk .dh.today { color: var(--c2); }
  .wk .time { font-size: 10.5px; font-weight: 700; color: var(--muted); padding-top: 4px; }
  .wk .cell { border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .wk .block { margin: 2px; padding: 6px 8px; border-radius: 11px; }
  .wk .block b { font-size: 11px; line-height: 1.2; }
  .wk .block .who { font-size: 9.5px; }
  .wk .block .when { display: none; }

  footer {
    margin-top: 18px; color: var(--muted); font-size: 11px; font-weight: 500;
    text-align: center; padding: 0 10px;
  }
  [hidden] { display: none !important; }

  .fab {
    position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); cursor: pointer;
    background: linear-gradient(155deg, var(--c0), var(--c1)); color: #fff; font-size: 24px; line-height: 1;
    display: flex; align-items: center; justify-content: center; font-weight: 300;
    box-shadow: 0 10px 26px -6px color-mix(in srgb, var(--c0) 65%, transparent), inset 0 1px 0 rgba(255,255,255,0.4);
    z-index: 20; transition: transform 0.15s ease;
  }
  .fab:active { transform: scale(0.92); }

  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(5,6,12,0.45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    z-index: 30; display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 440px; border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto;
    background: var(--glass-strong);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    border-top: 1px solid var(--glass-border);
  }
  .sheet::before {
    content: ""; display: block; width: 36px; height: 4px; border-radius: 2px;
    background: var(--line); margin: 0 auto 14px;
  }
  .sheet h3 { margin: 0 0 14px; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .field { margin-bottom: 11px; }
  .field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .field input, .field select {
    width: 100%; font: inherit; font-size: 14.5px; padding: 10px 11px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--glass); color: var(--ink);
    -webkit-appearance: none; appearance: none;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--glass-strong); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn { flex: 1; font: inherit; font-size: 14px; font-weight: 700; padding: 12px; border-radius: 13px; border: 0; cursor: pointer; transition: transform 0.15s ease; }
  .btn:active { transform: scale(0.97); }
  .btn.primary {
    background: linear-gradient(155deg, var(--c0), var(--c1)); color: #fff;
    box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--c0) 60%, transparent);
  }
  .btn.ghost { background: var(--glass); color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--danger); flex: none; padding: 12px 14px; }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="top">
    <header>
      <h1>Fourth Year</h1>
      <p>Software Engineering · Nangarhar University · 1405 Fall</p>
    </header>
    <div class="top-controls" style="display:flex; align-items:center; gap:8px;">
      <div class="themeseg glass" role="group" aria-label="Theme">
        <button id="themeLight" aria-selected="false" aria-label="Light mode" title="Light">☀︎</button>
        <button id="themeAuto" aria-selected="true" aria-label="Automatic (match device)" title="Auto">◐</button>
        <button id="themeDark" aria-selected="false" aria-label="Dark mode" title="Dark">☾</button>
      </div>
      <button class="iconbtn glass" id="editToggle" aria-pressed="false" aria-label="Edit timetable" title="Edit timetable">✎</button>
    </div>
  </div>

  <div class="seg glass" role="tablist" aria-label="View">
    <button role="tab" id="tabDay" aria-selected="true">Day</button>
    <button role="tab" id="tabWeek" aria-selected="false">Week</button>
  </div>

  <section id="dayView">
    <nav class="days" id="days" aria-label="Days"></nav>
    <div class="dayhead"><h2 id="dayTitle"></h2><span id="dayCount"></span></div>
    <div id="dayBody"></div>
  </section>

  <section id="weekView" hidden>
    <div class="scroll glass"><div class="wk" id="weekGrid"></div></div>
  </section>

  <footer id="footerNote">Classes run 50 min, on the hour · 01:00 = 1 PM · Tap ✎ to edit, saved on this device, works offline.</footer>
</div>

<button class="fab" id="fab" hidden aria-label="Add class">+</button>

<script>
  const SLOTS = [["08:00","08:50"],["09:00","09:50"],["10:00","10:50"],["11:00","11:50"],["12:00","12:50"],["01:00","01:50"]];
  const COLORS = ["c0","c1","c2","c3","c4","c5","c6"];
  const STORAGE_KEY = "fy-timetable-v1";

  const DEFAULT_WEEK = [
    { name: "Saturday", short: "Sat", classes: [
      { s: "Research", t: "Teach. Assist. Seerat", k: "c0", start: 0, len: 2 },
      { s: "Theory of Automata", t: "Mr. Dilawar", k: "c1", start: 2, len: 1 } ] },
    { name: "Sunday", short: "Sun", classes: [
      { s: "Theory of Automata", t: "Mr. Dilawar", k: "c1", start: 0, len: 2 },
      { s: "Internship", t: "Teach. Assist. Seerat", k: "c2", start: 2, len: 2 } ] },
    { name: "Monday", short: "Mon", classes: [] },
    { name: "Tuesday", short: "Tue", classes: [
      { s: "Assembly", t: "Dr. Haiderzai", k: "c3", start: 0, len: 2 },
      { s: "Internship", t: "Teach. Assist. Seerat", k: "c2", start: 4, len: 2 } ] },
    { name: "Wednesday", short: "Wed", classes: [
      { s: "Islamic Study", t: "Mr. Rasih", k: "c4", start: 0, len: 2 },
      { s: "Computer Graphics", t: "Mr. Sherzad", k: "c5", start: 2, len: 2 },
      { s: "Research", t: "Teach. Assist. Seerat", k: "c0", start: 4, len: 2 } ] },
    { name: "Thursday", short: "Thu", classes: [
      { s: "Assembly", t: "Dr. Haiderzai", k: "c3", start: 0, len: 1 },
      { s: "Assembly (Lab)", t: "Dr. Haiderzai", k: "c3", start: 1, len: 2 },
      { s: "Computer Graphics", t: "Mr. Sherzad", k: "c5", start: 3, len: 2 } ] }
  ];

  function loadWeek() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length === 6) return parsed;
      }
    } catch (e) { /* fall through to defaults */ }
    return JSON.parse(JSON.stringify(DEFAULT_WEEK));
  }
  function saveWeek() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(WEEK)); }
    catch (e) { console.error("Could not save — storage may be full or unavailable.", e); }
  }

  let WEEK = loadWeek();
  const JS_DAY_TO_INDEX = { 6: 0, 0: 1, 1: 2, 2: 3, 3: 4, 4: 5 };
  const todayIdx = JS_DAY_TO_INDEX[new Date().getDay()];
  let current = todayIdx === undefined ? 0 : todayIdx;
  let editMode = false;

  const range = c => SLOTS[c.start][0] + " \u2013 " + SLOTS[c.start + c.len - 1][1];
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
  function freeRuns(dayClasses) {
    const taken = new Array(SLOTS.length).fill(false);
    dayClasses.forEach(c => { for (let i = 0; i < c.len; i++) taken[c.start + i] = true; });
    const runs = [];
    let i = 0;
    while (i < SLOTS.length) {
      if (!taken[i]) { let j = i; while (j < SLOTS.length && !taken[j]) j++; runs.push({ start: i, len: j - i }); i = j; }
      else i++;
    }
    return runs;
  }

  function block(dayIdx, c, showTime) {
    const b = el(editMode ? "button" : "div", "block" + (editMode ? " editable" : ""));
    b.style.setProperty("--c", "var(--" + c.k + ")");
    b.innerHTML = "<b></b><span class='who'></span>" + (showTime ? "<span class='when'></span>" : "");
    b.querySelector("b").textContent = c.s;
    b.querySelector(".who").textContent = c.t;
    if (showTime) b.querySelector(".when").textContent = range(c);
    if (editMode) b.onclick = () => openSheet(dayIdx, c);
    return b;
  }

  function renderDays() {
    const nav = document.getElementById("days");
    nav.innerHTML = "";
    WEEK.forEach((d, i) => {
      const btn = el("button", "glass" + (i === todayIdx ? " today" : ""), d.short);
      btn.setAttribute("aria-selected", i === current);
      btn.setAttribute("aria-label", d.name);
      btn.onclick = () => { current = i; renderDays(); renderDay(); };
      nav.appendChild(btn);
    });
  }

  function renderDay() {
    const d = WEEK[current];
    document.getElementById("dayTitle").textContent = d.name;
    document.getElementById("dayCount").textContent =
      d.classes.length === 0 ? "Free day" : d.classes.length + (d.classes.length === 1 ? " class" : " classes");
    const body = document.getElementById("dayBody");
    body.className = editMode ? "editing" : "";
    body.innerHTML = "";
    if (d.classes.length === 0 && !editMode) {
      body.appendChild(el("div", "empty glass", "<b>No classes on " + d.name + "</b><span>Nothing scheduled for fourth year.</span>"));
      return;
    }
    const tl = el("div", "tl");
    SLOTS.forEach((s, i) => {
      const t = el("div", "time", s[0]); t.style.gridRow = (i + 1); tl.appendChild(t);
      const c = el("div", "slot"); c.style.gridRow = (i + 1); tl.appendChild(c);
    });
    d.classes.slice().sort((a, b2) => a.start - b2.start).forEach(c => {
      const b = block(current, c, true);
      b.style.gridColumn = "2"; b.style.gridRow = (c.start + 1) + " / span " + c.len;
      tl.appendChild(b);
    });
    if (editMode) {
      freeRuns(d.classes).forEach(run => {
        const btn = el("button", "addslot", "+ Add " + SLOTS[run.start][0]);
        btn.style.gridColumn = "2"; btn.style.gridRow = (run.start + 1) + " / span " + run.len;
        btn.onclick = () => openSheet(current, null, run.start, Math.min(run.len, 2));
        tl.appendChild(btn);
      });
    }
    body.appendChild(tl);
  }

  function renderWeek() {
    const g = document.getElementById("weekGrid");
    g.className = "wk" + (editMode ? " editing" : "");
    g.style.gridTemplateRows = "34px repeat(" + SLOTS.length + ", 62px)";
    g.innerHTML = "";
    WEEK.forEach((d, j) => {
      const h = el("div", "dh" + (j === todayIdx ? " today" : ""), d.short);
      h.style.gridColumn = (j + 2); h.style.gridRow = 1; g.appendChild(h);
    });
    SLOTS.forEach((s, i) => {
      const t = el("div", "time", s[0]); t.style.gridColumn = 1; t.style.gridRow = (i + 2); g.appendChild(t);
      WEEK.forEach((d, j) => {
        const c = el("div", "cell"); c.style.gridColumn = (j + 2); c.style.gridRow = (i + 2); g.appendChild(c);
      });
    });
    WEEK.forEach((d, j) => d.classes.forEach(c => {
      const b = block(j, c, false);
      b.style.gridColumn = (j + 2); b.style.gridRow = (c.start + 2) + " / span " + c.len;
      g.appendChild(b);
    }));
  }

  function renderAll() { renderDays(); renderDay(); renderWeek(); }

  function setView(view) {
    const isDay = view === "day";
    document.getElementById("dayView").hidden = !isDay;
    document.getElementById("weekView").hidden = isDay;
    document.getElementById("tabDay").setAttribute("aria-selected", isDay);
    document.getElementById("tabWeek").setAttribute("aria-selected", !isDay);
    document.getElementById("page").classList.toggle("wide", !isDay);
  }
  document.getElementById("tabDay").onclick = () => setView("day");
  document.getElementById("tabWeek").onclick = () => setView("week");

  document.getElementById("editToggle").onclick = () => {
    editMode = !editMode;
    document.getElementById("editToggle").setAttribute("aria-pressed", editMode);
    document.getElementById("fab").hidden = !editMode;
    document.getElementById("footerNote").textContent = editMode
      ? "Tap a class to edit or delete it · Tap a dashed slot to add one · Saved automatically."
      : "Classes run 50 min, on the hour · 01:00 = 1 PM · Tap ✎ to edit, saved on this device, works offline.";
    renderAll();
  };
  document.getElementById("fab").onclick = () => openSheet(current, null);

  // --- Edit sheet ---
  function openSheet(dayIdx, cls, defStart, defLen) {
    const isNew = !cls;
    const backdrop = el("div", "sheet-backdrop");
    backdrop.onclick = e => { if (e.target === backdrop) closeSheet(); };
    const sheet = el("div", "sheet");
    sheet.innerHTML =
      "<h3>" + (isNew ? "Add class" : "Edit class") + "</h3>" +
      "<div class='field'><label for='fSubject'>Subject</label><input id='fSubject' maxlength='60'></div>" +
      "<div class='field'><label for='fTeacher'>Teacher</label><input id='fTeacher' maxlength='60'></div>" +
      "<div class='field'><label for='fDay'>Day</label><select id='fDay'></select></div>" +
      "<div class='row2'>" +
        "<div class='field'><label for='fStart'>Starts</label><select id='fStart'></select></div>" +
        "<div class='field'><label for='fEnd'>Ends</label><select id='fEnd'></select></div>" +
      "</div>" +
      "<div class='field'><label>Color</label><div class='swatches' id='fSwatches'></div></div>" +
      "<div class='sheet-actions' id='fActions'></div>";
    backdrop.appendChild(sheet);
    document.body.appendChild(backdrop);

    const fSubject = sheet.querySelector("#fSubject");
    const fTeacher = sheet.querySelector("#fTeacher");
    const fDay = sheet.querySelector("#fDay");
    const fStart = sheet.querySelector("#fStart");
    const fEnd = sheet.querySelector("#fEnd");
    const fSwatches = sheet.querySelector("#fSwatches");
    const fActions = sheet.querySelector("#fActions");

    WEEK.forEach((d, i) => fDay.appendChild(new Option(d.name, i)));
    SLOTS.forEach((s, i) => { fStart.appendChild(new Option(s[0], i)); fEnd.appendChild(new Option(s[1], i)); });

    let selectedColor = cls ? cls.k : COLORS[(WEEK[dayIdx].classes.length) % COLORS.length];
    COLORS.forEach(k => {
      const sw = el("button", "swatch");
      sw.style.background = "var(--" + k + ")";
      sw.setAttribute("aria-pressed", k === selectedColor);
      sw.setAttribute("aria-label", "Color");
      sw.onclick = () => { selectedColor = k; fSwatches.querySelectorAll(".swatch").forEach(s2 => s2.setAttribute("aria-pressed", s2 === sw)); };
      fSwatches.appendChild(sw);
    });

    fSubject.value = cls ? cls.s : "";
    fTeacher.value = cls ? cls.t : "";
    fDay.value = dayIdx;
    fStart.value = cls ? cls.start : (defStart !== undefined ? defStart : 0);
    fEnd.value = cls ? (cls.start + cls.len - 1) : (defStart !== undefined ? defStart + (defLen || 1) - 1 : 0);

    const saveBtn = el("button", "btn primary", isNew ? "Add class" : "Save changes");
    saveBtn.onclick = () => {
      const subj = fSubject.value.trim();
      const teach = fTeacher.value.trim();
      if (!subj) { fSubject.focus(); return; }
      const start = parseInt(fStart.value, 10);
      const end = parseInt(fEnd.value, 10);
      if (end < start) { fEnd.focus(); return; }
      const newDayIdx = parseInt(fDay.value, 10);
      const entry = { s: subj, t: teach || "TBA", k: selectedColor, start, len: end - start + 1 };
      if (!isNew) WEEK[dayIdx].classes = WEEK[dayIdx].classes.filter(c => c !== cls);
      WEEK[newDayIdx].classes.push(entry);
      saveWeek();
      current = newDayIdx;
      closeSheet();
      renderAll();
    };
    fActions.appendChild(saveBtn);

    const cancelBtn = el("button", "btn ghost", "Cancel");
    cancelBtn.onclick = closeSheet;
    fActions.appendChild(cancelBtn);

    if (!isNew) {
      const delBtn = el("button", "btn danger", "Delete");
      delBtn.onclick = () => {
        WEEK[dayIdx].classes = WEEK[dayIdx].classes.filter(c => c !== cls);
        saveWeek();
        closeSheet();
        renderAll();
      };
      fActions.appendChild(delBtn);
    }

    setTimeout(() => fSubject.focus(), 30);
  }
  function closeSheet() {
    const b = document.querySelector(".sheet-backdrop");
    if (b) b.remove();
  }

  // --- Theme switch ---
  const THEME_KEY = "fy-theme-v1";
  const themeBtns = { light: document.getElementById("themeLight"), auto: document.getElementById("themeAuto"), dark: document.getElementById("themeDark") };
  function applyTheme(mode) {
    if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
    else document.documentElement.removeAttribute("data-theme");
    Object.keys(themeBtns).forEach(k => themeBtns[k].setAttribute("aria-selected", k === mode));
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
  }
  themeBtns.light.onclick = () => applyTheme("light");
  themeBtns.auto.onclick = () => applyTheme("auto");
  themeBtns.dark.onclick = () => applyTheme("dark");
  let savedTheme = "auto";
  try { savedTheme = localStorage.getItem(THEME_KEY) || "auto"; } catch (e) {}
  applyTheme(savedTheme);

  renderAll();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
